name: Build Android APK (Presensi Siswa)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d97543887675f10fa252d5081ded4cf304ea74c0" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "791244726565982e1b3d7b141f54a44973ad494b" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "856222d2338571e7be668438cacac47aa0b0f7fc" >> "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "601085b94cd77f0b54ff86406957099150008536" >> "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64f07f11b283f85dc9b941570d507729f" >> "$ANDROID_HOME/licenses/google-gdk-license"
          echo "e9acab5b5fbb560a72cfa4f69c30ed2e08ad5d97" >> "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Presensi-Siswa-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
